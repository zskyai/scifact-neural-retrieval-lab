services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/scifact:/data/scifact:ro
      - ./results/qdrant_local:/data/qdrant_local
    environment:
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
